<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge Records</title><meta name="theme-color" content="#000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Archivo+Black&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=22">
<style>
html,body{overflow-x:hidden;overflow-y:auto;height:auto}
body{background:#000}
.ahead{display:flex;align-items:center;gap:18px;padding:calc(92px + env(safe-area-inset-top)) 10px 26px}
.aphoto{flex:none;width:min(46vw,260px);aspect-ratio:1;background:#111 center/cover no-repeat}
.aname{font-family:Unbounded;font-weight:900;font-size:clamp(24px,7.6vw,56px);letter-spacing:.04em;word-break:break-word;text-transform:uppercase;color:#cfd2d6;line-height:1.15}
.abody{position:relative;min-height:120vh;padding:30px 40px 140px;overflow:hidden}
.abg{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:.5;filter:grayscale(.2) blur(1px);transform:scale(1.15);transform-origin:top center}
.abody::after{content:"";position:absolute;inset:0;background:linear-gradient(#000 0,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 70%,#000 100%);pointer-events:none}
.tl{position:relative;z-index:1;max-width:620px}
.yr{font-family:Unbounded;font-weight:900;font-size:clamp(48px,14vw,96px);letter-spacing:.02em;margin:10px 0 26px}
.ev{margin-bottom:34px}.ev .d{font-family:Unbounded;font-weight:700;font-size:17px;margin-bottom:14px}.ev .h{font:400 20px/1.4 system-ui,-apple-system,sans-serif;color:#fff}
.ev.s .d{font-size:11px;color:#9a9da2;margin-bottom:10px}.ev.s .h{font-size:14px;color:#a6a9ae}
.prog{position:fixed;left:0;top:0;width:4px;height:0;background:#fff;z-index:40;border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(255,255,255,.4)}
nav.social{position:fixed!important;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50}
.asoc-bg{position:fixed;left:0;right:0;bottom:0;height:calc(40px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 60%);z-index:45;pointer-events:none}
.nf{padding:160px 30px;font-family:Unbounded;text-align:center}.nf a{color:#fff}
</style></head><body>
<header><div class="logo"><a href="/" style="display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none"><span class="mini badge-slot"></span><b>1 year</b></a></div>
<div class="right"><div class="view"><span>View by</span><button class="on" aria-label="Galería"><svg viewBox="0 0 20 20"><rect x="2" y="7" width="11" height="11" fill="#fff"/><rect x="8" y="2" width="10" height="10" fill="#fff" stroke="#000" stroke-width="1.5"/></svg></button><button aria-label="Cronología"><svg viewBox="0 0 20 20" fill="none" stroke="#bbb" stroke-width="1.8"><circle cx="10" cy="10" r="8"/><path d="M10 5v5l3 2"/></svg></button></div>
<a class="burger" href="/?menu=1" aria-label="Menú"><i></i><i></i><i></i></a></div></header>
<div class="prog" id="prog"></div>
<main id="artist"></main>
<div class="asoc-bg"></div><nav class="social">
<a aria-label="TikTok" href="#"><svg viewBox="0 0 24 24"><path d="M12.5 2h3.1c.2 1.9 1.4 3.3 3.6 3.5v3.1c-1.4 0-2.6-.4-3.6-1.1v6.4a5.6 5.6 0 1 1-5.6-5.6v3.2a2.5 2.5 0 1 0 2.5 2.4z"/></svg></a>
<a aria-label="Facebook" href="#"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4"/><path fill="#000" d="M13.6 22v-7.5h2.5l.4-2.9h-2.9V9.8c0-.8.3-1.4 1.5-1.4h1.5V5.8c-.3 0-1.2-.1-2.2-.1-2.1 0-3.6 1.3-3.6 3.7v2.2H8.4v2.9h2.4V22z"/></svg></a>
<a aria-label="X" href="#"><svg viewBox="0 0 24 24"><path d="M17.8 2.5h3.1l-6.8 7.8 8 11.2h-6.3l-4.9-6.5-5.6 6.5H2.2l7.3-8.4L1.8 2.5h6.4l4.4 5.9zm-1.1 17.1h1.7L7.4 4.3H5.6z"/></svg></a>
<a aria-label="Instagram" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".6" fill="#fff"/></svg></a>
<a aria-label="SoundCloud" href="#"><svg viewBox="0 0 30 24"><path d="M14 8.5a6 6 0 0 1 11 3.3 3.6 3.6 0 0 1 .4 7.2H14z"/><rect x="11" y="9" width="1.6" height="10"/><rect x="8" y="10.5" width="1.6" height="8.5"/><rect x="5" y="12" width="1.6" height="7"/><rect x="2" y="13.5" width="1.6" height="5.5"/></svg></a>
<a aria-label="Spotify" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5"/><g fill="none" stroke="#000" stroke-linecap="round"><path d="M6.5 9c4-1.2 8-.8 11.2 1" stroke-width="2"/><path d="M7 12.5c3.3-.9 6.5-.6 9.3.9" stroke-width="1.7"/><path d="M7.6 15.7c2.6-.6 5.1-.4 7.3.7" stroke-width="1.4"/></g></svg></a>
<a aria-label="YouTube" href="#"><svg viewBox="0 0 28 24"><rect x="1" y="4" width="26" height="16" rx="5"/><path fill="#000" d="M11.5 8.5v7l6-3.5z"/></svg></a>
</nav>
<script src="badge.js?v=22"></script><script src="artists.js?v=22"></script>
<script>
document.querySelectorAll('.badge-slot').forEach((e,i)=>e.innerHTML=badgeSVG('a'+i));
const q=new URLSearchParams(location.search),slug=q.get('a');
if(q.get('frontpage')!=='true'){q.set('frontpage','true');history.replaceState(null,'','?'+q.toString())}
const A=ARTISTS.find(x=>x.s===slug),m=document.getElementById('artist');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!A){m.innerHTML='<div class="nf"><p>Artista no encontrado.</p><p><a href="/">Volver</a></p></div>'}
else{document.title=A.n+' · Forge Records';
m.innerHTML=`<section class="ahead"><div class="aphoto" style="background-image:url('${A.img}')" role="img" aria-label="${esc(A.n)}"></div><h1 class="aname">${esc(A.n)}</h1></section>
<section class="abody"><div class="abg" style="background-image:url('${A.img}')"></div><div class="tl">${A.tl.map(g=>`<h2 class="yr">${g.y}</h2>`+g.items.map((it,i)=>`<div class="ev${it.h?'':' s'}"><div class="d">${it.d}</div><div class="h">${esc(it.h||it.t)}</div></div>`).join('')).join('')}
<div class="ev s"><div class="d">2026</div><div class="h">Forge Records fue fundada</div></div></div></section>`}
const pr=document.getElementById('prog');function up(){const h=document.documentElement.scrollHeight-innerHeight;pr.style.height=(h>0?scrollY/h:0)*100+'vh'}addEventListener('scroll',up,{passive:true});up();
</script></body></html>
