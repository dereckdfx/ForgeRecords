<link rel="stylesheet" href="style.css?v=62">
<style>
html,body{overflow-x:hidden;overflow-y:auto;height:auto}
body{background:#000}
.ahead{display:flex;align-items:center;gap:18px;padding:calc(92px + env(safe-area-inset-top)) 10px 26px}
.aphoto{flex:none;width:min(46vw,260px);aspect-ratio:1;background:#111 center/cover no-repeat}
.ahtx{flex:1;min-width:0}.ahtx .aname{flex:none;width:100%}
.atag{margin:14px 0 0;padding:0 0 0 12px;border-left:2px solid rgba(255,255,255,.75);max-width:34ch}
.atag p{margin:0;font:italic 400 clamp(14px,3.9vw,22px)/1.35 Georgia,'Times New Roman',serif;color:#e9ebee;letter-spacing:.01em;overflow-wrap:break-word}
.atag cite{display:block;margin-top:6px;font:700 clamp(9px,2.4vw,11px)/1.2 Unbounded,sans-serif;font-style:normal;letter-spacing:.18em;text-transform:uppercase;color:#9a9ea4}
.aname{font-family:Unbounded;font-weight:900;font-size:clamp(24px,7.6vw,56px);letter-spacing:.04em;word-break:normal;overflow-wrap:normal;hyphens:none;text-transform:uppercase;min-width:0;flex:1;color:#cfd2d6;line-height:1.15}
.abody{position:relative;min-height:100vh;padding:30px 40px 60px;overflow:hidden}
.abg{position:absolute;inset:0;background:#000 center/cover no-repeat;opacity:.42;filter:grayscale(.2) blur(1px);transform:scale(1.15);transform-origin:top center}
.abody::after{content:"";position:absolute;inset:0;background:linear-gradient(#000 0,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 70%,#000 100%);pointer-events:none}
.tl{position:relative;z-index:1;max-width:620px}
.yr{font-family:Unbounded;font-weight:900;font-size:clamp(48px,14vw,96px);letter-spacing:.02em;margin:10px 0 26px}
.ev{margin-bottom:34px;overflow-wrap:break-word;word-break:normal;min-width:0;max-width:100%;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.8)}.ev .d{font-family:Unbounded;font-weight:700;font-size:17px;margin-bottom:14px}.ev .h{font:400 20px/1.4 system-ui,-apple-system,sans-serif;color:#fff}
.ev.s .d{font-size:11px;color:#9a9da2;margin-bottom:10px}.ev.s .h{font-size:14px;color:#a6a9ae}
.prog{position:fixed;left:0;top:0;width:4px;height:0;background:#fff;z-index:40;border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(255,255,255,.4)}
.yr.sm{font-size:clamp(22px,6.4vw,40px);margin-top:20px}
.ev .n{margin-top:6px;font:700 10px/1.3 Unbounded;letter-spacing:.06em;text-transform:uppercase;color:#e6e7e9}
.ev .q{margin-top:8px;font:italic 400 13px/1.45 system-ui,-apple-system,sans-serif;color:#c9cbcf}
.nf{padding:160px 30px;font-family:Unbounded;text-align:center}.nf a{color:#fff}
</style></head><body>

<script>
document.querySelectorAll('.badge-slot').forEach((e,i)=>e.innerHTML=badgeSVG('a'+i));
const q=new URLSearchParams(location.search),slug=q.get('a');
if(q.get('frontpage')!=='true'){q.set('frontpage','true');history.replaceState(null,'','?'+q.toString())}
const A=ARTISTS.find(x=>x.s===slug),m=document.getElementById('artist');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!A){m.innerHTML='<div class="nf"><p>Artista no encontrado.</p><p><a href="/?nointro=1">Volver</a></p></div>'}
else{document.title=A.n+' · Forge Records';
m.innerHTML=`<section class="ahead"><div class="aphoto" style="background-image:url('${A.img}')${A.pos?';background-position:'+A.pos:''}${A.fit?';background-size:contain;background-color:#000':''}" role="img" aria-label="${esc(A.n)}"></div><div class="ahtx"><h1 class="aname">${esc(A.n)}</h1>${A.tagline?`<blockquote class="atag"><p>“${esc(A.tagline)}”</p>${A.taglineBy?`<cite>— ${esc(A.taglineBy)}</cite>`:''}</blockquote>`:''}</div></section>
<section class="abody"><div class="abg" style="background-image:url('${A.img}')"></div><div class="tl">${A.tl.map(g=>`<h2 class="yr${isNaN(g.y)?' sm':''}">${g.y}</h2>`+g.items.map((it,i)=>`<div class="ev${it.h?'':' s'}">${it.d?`<div class="d">${it.d}</div>`:''}<div class="h">${esc(it.h||it.t)}</div>${it.n?`<div class="n">${esc(it.n)}</div>`:''}${it.q?`<div class="q">${esc(it.q)}</div>`:''}</div>`).join('')).join('')}
</div></section>`}
{const fm=document.querySelector('#foot .fform');fm.onsubmit=e=>{e.preventDefault();const i=fm.querySelector('input[type=email]');if(!i.value||!i.checkValidity()){i.focus();i.style.borderColor='#ff6b6b';return}fm.innerHTML='<p class="fthanks">¡Gracias! Te mantendremos al tanto.</p>'}}
const pr=document.getElementById('prog');function up(){const h=document.documentElement.scrollHeight-innerHeight;pr.style.height=(h>0?scrollY/h:0)*100+'vh'}addEventListener('scroll',up,{passive:true});up();
// shrink the name so no single word is cut mid-word
{const h=document.querySelector('.aname');const fit=()=>{if(!h)return;h.style.fontSize='';let fs=parseFloat(getComputedStyle(h).fontSize);while(fs>14&&h.scrollWidth>h.clientWidth+1){fs-=1;h.style.fontSize=fs+'px'}};fit();addEventListener('resize',fit);document.fonts&&document.fonts.ready.then(fit)}
</script></body></html>
