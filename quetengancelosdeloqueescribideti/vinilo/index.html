<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinilo - Love is in the Air, Pt. 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fluid shifting animated red gradient background */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #7a0000, #b90000, #e01111, #8b0000, #500000);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            color: #1a1a1a;
            overflow: hidden;
        }

        /* Subtle ambient float animation for the player stage */
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .stage-float {
            animation: subtleFloat 6s ease-in-out infinite;
        }

        /* Continuous vinyl spin animation */
        @keyframes spin-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .vinyl-spin {
            animation: spin-vinyl 2.8s linear infinite;
        }
        .vinyl-paused {
            animation-play-state: paused;
        }

        /* Authentic dark vinyl grooves texture */
        .vinyl-grooves {
            background: 
                radial-gradient(circle, 
                    #8b0000 0%, #8b0000 18.5%, 
                    #0f0f0f 19%, #171717 19.5%, 
                    #0b0b0b 24%, #1c1c1c 29%, 
                    #0d0d0d 34%, #181818 41%, 
                    #080808 49%, #1b1b1b 59%, 
                    #0d0d0d 69%, #151515 84%, 
                    #080808 100%
                );
            box-shadow: 
                0 20px 45px -5px rgba(0, 0, 0, 0.6),
                0 10px 20px -5px rgba(0, 0, 0, 0.4),
                inset 0 0 15px rgba(255, 255, 255, 0.15);
        }

        /* Vinyl shine reflection layer */
        .vinyl-shine {
            background: conic-gradient(
                from 45deg at 50% 50%,
                rgba(255, 255, 255, 0.18) 0deg,
                rgba(255, 255, 255, 0.0) 45deg,
                rgba(255, 255, 255, 0.14) 180deg,
                rgba(255, 255, 255, 0.0) 225deg,
                rgba(255, 255, 255, 0.18) 360deg
            );
        }

        /* Tonearm rotation and smooth transition */
        .tonearm-wrapper {
            transform-origin: 50px 50px;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .tonearm-playing {
            transform: rotate(0deg);
        }
        .tonearm-stopped {
            transform: rotate(-26deg);
        }

        /* Smooth sleeve sliding & placement transitions */
        .player-wrapper {
            transition: transform 0.8s cubic-bezier(0.34, 1.25, 0.64, 1);
        }

        .sleeve-container {
            transition: transform 0.8s cubic-bezier(0.34, 1.25, 0.64, 1), box-shadow 0.8s ease;
        }

        .vinyl-slider {
            transition: transform 0.9s cubic-bezier(0.34, 1.15, 0.64, 1);
        }

        /* Vinyl fully inside sleeve (hidden behind cover) */
        .vinyl-inside {
            transform: translateX(0%) scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        /* Vinyl ejected to playing position */
        .vinyl-outside {
            transform: translateX(52%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Depth z-index toggle for album cover */
        .depth-front {
            z-index: 30 !important;
            box-shadow: -15px 25px 45px rgba(0, 0, 0, 0.5);
        }
        .depth-back {
            z-index: 10 !important;
            box-shadow: -5px 12px 25px rgba(0, 0, 0, 0.3);
        }

        /* Center position when record is stored */
        .stage-centered {
            transform: translateX(10vw);
        }
        .stage-playing {
            transform: translateX(-4vw);
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 overflow-hidden">

    <!-- Ambient Vignette & Glow Overlay -->
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,_transparent_40%,_rgba(0,0,0,0.5)_100%)] z-50"></div>

    <!-- Main Stage Container (Responsive and Screen-fitted with larger scale) -->
    <div id="player-wrapper" class="player-wrapper stage-centered relative w-full h-full max-w-[1150px] max-h-[820px] flex items-center justify-center scale-105">

        <!-- ALBUM SLEEVE & VINYL DISK GROUP -->
        <div class="relative w-[44vw] min-w-[340px] max-w-[500px] aspect-square flex items-center justify-center">
            
            <!-- VINYL DISC (Restored to classic full size) -->
            <div id="vinyl-container" 
                 class="vinyl-slider vinyl-inside absolute top-0 w-full h-full rounded-full z-20 flex items-center justify-center cursor-pointer select-none"
                 onclick="handleVinylClick(event)"
                 ondblclick="handleVinylDoubleClick(event)">
                
                <!-- Vinyl Record Body -->
                <div id="vinyl-disc" class="w-full h-full rounded-full vinyl-grooves vinyl-spin vinyl-paused relative flex items-center justify-center">
                    
                    <!-- Sheen overlay -->
                    <div class="absolute inset-0 rounded-full vinyl-shine pointer-events-none"></div>

                    <!-- Central Red Vinyl Label -->
                    <div class="w-[38%] h-[38%] rounded-full bg-gradient-to-tr from-[#8b0000] via-[#c00000] to-[#990000] relative flex flex-col items-center justify-center border border-red-300/40 shadow-2xl overflow-hidden text-center">
                        
                        <!-- Micro barcode graphic -->
                        <div class="absolute top-2 w-14 h-2.5 opacity-90 flex justify-center items-center bg-white/95 px-0.5 py-[1px] rounded-[1px] shadow-sm">
                            <div class="w-full h-full flex justify-between items-center overflow-hidden">
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[2px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[3px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[2px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[3px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[2px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[1px] h-full bg-black"></div>
                                <div class="w-[2px] h-full bg-black"></div>
                            </div>
                        </div>

                        <!-- Label Typography -->
                        <div class="flex flex-col items-center justify-center transform rotate-180 mt-1.5 px-1.5">
                            <span class="font-cinzel text-[8px] sm:text-[10px] md:text-[11px] font-bold text-white tracking-wider leading-tight mb-0.5 drop-shadow-md">Love is in the Air, Pt. 1</span>
                            <span class="text-[6.5px] sm:text-[7.5px] md:text-[8.5px] text-red-100/90 tracking-widest font-medium uppercase">Sade</span>
                        </div>

                        <!-- Center Spindle Hole -->
                        <div class="w-3 h-3 md:w-3.5 md:h-3.5 rounded-full bg-[#500000] border border-stone-900 shadow-inner z-10 absolute"></div>
                    </div>
                </div>
            </div>

            <!-- ALBUM COVER (SLEEVE) -->
            <div id="album-cover" 
                 class="sleeve-container depth-front absolute inset-0 w-full h-full rounded-sm cursor-pointer select-none"
                 onclick="handleCoverClick()">
                
                <div class="w-full h-full relative overflow-hidden rounded-sm bg-[#dfd6b8] border border-black/10">
                    <!-- Custom Album Cover Image -->
                    <img src="https://i.ibb.co/gFzCkSv7/Que-Tengan-Celos-De-Lo-Que-Escribi-de-ti-cover-5000-X-5000-1.png" 
                         alt="Album Cover" 
                         class="w-full h-full object-cover block filter brightness-[1.02] contrast-[1.03]"
                         onerror="this.src='https://placehold.co/800x800/d8cbb5/333?text=Cover+Image'">
                    
                    <!-- Inner border reflection -->
                    <div class="absolute inset-0 border border-white/20 pointer-events-none"></div>
                </div>
            </div>

        </div>

        <!-- TONEARM MECHANISM (Separated from disc edge and centered better) -->
        <div id="tonearm-base" 
             class="absolute right-[4%] sm:right-[6%] md:right-[8%] top-[10%] sm:top-[12%] w-[140px] h-[320px] sm:w-[160px] sm:h-[370px] md:w-[175px] md:h-[400px] z-40 pointer-events-auto cursor-pointer"
             onclick="togglePlayState()">
            
            <!-- White rounded base outline (Shifted slightly right to separate from disc) -->
            <div class="absolute right-0 top-0 w-24 sm:w-28 h-36 sm:h-40 rounded-full border border-white/20 bg-transparent pointer-events-none">
                <div class="absolute top-2 right-2 w-16 sm:w-20 h-16 sm:h-20 rounded-full border border-white/15"></div>
            </div>

            <!-- Tonearm Assembly -->
            <div id="tonearm" class="w-full h-full relative tonearm-wrapper tonearm-stopped">
                
                <!-- Pivot Base Mount -->
                <div class="absolute top-6 right-7 w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-[#e2ded5] shadow-lg border border-stone-300 flex items-center justify-center">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-[#d6d0c4] border border-stone-400/50 shadow-inner flex items-center justify-center">
                        <div class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-stone-300 border border-stone-400"></div>
                    </div>
                </div>

                <!-- Metallic Arm Shaft -->
                <div class="absolute top-12 right-[46px] sm:right-[54px] w-[5px] sm:w-[6px] h-[220px] sm:h-[260px] md:h-[285px] bg-gradient-to-r from-stone-200 via-stone-100 to-stone-400 rounded-full shadow-lg"></div>

                <!-- White Cartridge / Headshell -->
                <div class="absolute bottom-6 sm:bottom-8 right-[28px] sm:right-[34px] w-8 sm:w-9 h-12 sm:h-14 bg-[#f7f5f0] border border-stone-300 shadow-xl rounded-sm transform -rotate-12 flex flex-col items-center justify-between p-1">
                    <div class="w-1.5 h-3.5 bg-stone-300 rounded-full absolute -right-1.5 top-2.5"></div>
                    <div class="w-full h-1.5 bg-stone-200 border-b border-stone-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-stone-800 mb-0.5"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- Interactive & Web Audio Logic -->
    <script>
        let isPlaying = false;
        let isCoverFront = true;
        let isVinylEjected = false;
        let clickTimer = null;

        let audioCtx = null;
        let vinylCrackleNode = null;
        let musicGain = null;
        let oscillators = [];

        // Auto-intro animation: Eject vinyl automatically after 2 seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                ejectVinyl();
            }, 2000);
        });

        function ejectVinyl() {
            const playerWrapper = document.getElementById('player-wrapper');
            const vinyl = document.getElementById('vinyl-container');
            
            playerWrapper.classList.remove('stage-centered');
            playerWrapper.classList.add('stage-playing');

            vinyl.classList.remove('vinyl-inside');
            vinyl.classList.add('vinyl-outside');
            isVinylEjected = true;
        }

        function insertVinyl() {
            if (isPlaying) {
                togglePlayState(); // Stop music if playing when stored
            }

            const playerWrapper = document.getElementById('player-wrapper');
            const vinyl = document.getElementById('vinyl-container');

            vinyl.classList.remove('vinyl-outside');
            vinyl.classList.add('vinyl-inside');

            playerWrapper.classList.remove('stage-playing');
            playerWrapper.classList.add('stage-centered');
            isVinylEjected = false;
        }

        function handleCoverClick() {
            if (!isVinylEjected) {
                ejectVinyl();
            } else {
                toggleCoverDepth();
            }
        }

        function handleVinylClick(event) {
            if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (!isVinylEjected) {
                        ejectVinyl();
                    } else {
                        togglePlayState();
                    }
                }, 250);
            }
        }

        function handleVinylDoubleClick(event) {
            if (clickTimer !== null) {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
            if (isVinylEjected) {
                insertVinyl();
            } else {
                ejectVinyl();
            }
        }

        // Depth positioning (Front <-> Behind Vinyl)
        function toggleCoverDepth() {
            const cover = document.getElementById('album-cover');
            if (isCoverFront) {
                cover.classList.remove('depth-front');
                cover.classList.add('depth-back');
                isCoverFront = false;
            } else {
                cover.classList.remove('depth-back');
                cover.classList.add('depth-front');
                isCoverFront = true;
            }
        }

        // Toggle Playback and Tonearm Position
        function togglePlayState() {
            if (!isVinylEjected) {
                ejectVinyl();
                return;
            }

            isPlaying = !isPlaying;
            const vinylDisc = document.getElementById('vinyl-disc');
            const tonearm = document.getElementById('tonearm');

            if (isPlaying) {
                vinylDisc.classList.remove('vinyl-paused');
                tonearm.classList.remove('tonearm-stopped');
                tonearm.classList.add('tonearm-playing');
                startSoundtrack();
            } else {
                vinylDisc.classList.add('vinyl-paused');
                tonearm.classList.remove('tonearm-playing');
                tonearm.classList.add('tonearm-stopped');
                stopSoundtrack();
            }
        }

        // Web Audio Synthesizer
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startSoundtrack() {
            initAudioContext();
            stopSoundtrack();

            musicGain = audioCtx.createGain();
            musicGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            musicGain.connect(audioCtx.destination);

            const chords = [138.59, 174.61, 207.65, 261.63, 311.13];
            chords.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(musicGain);
                osc.start();
                oscillators.push(osc);
            });

            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                if (Math.random() < 0.0012) {
                    output[i] = (Math.random() * 2 - 1) * 0.7;
                } else {
                    output[i] = (Math.random() * 2 - 1) * 0.015;
                }
            }

            vinylCrackleNode = audioCtx.createBufferSource();
            vinylCrackleNode.buffer = noiseBuffer;
            vinylCrackleNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1400;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.06, audioCtx.currentTime);

            vinylCrackleNode.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            vinylCrackleNode.start();
        }

        function stopSoundtrack() {
            if (oscillators.length > 0) {
                oscillators.forEach(osc => {
                    try { osc.stop(); } catch(e){}
                });
                oscillators = [];
            }
            if (vinylCrackleNode) {
                try { vinylCrackleNode.stop(); } catch(e){}
                vinylCrackleNode = null;
            }
            if (musicGain) {
                musicGain.disconnect();
                musicGain = null;
            }
        }
    </script>
</body>
</html>
