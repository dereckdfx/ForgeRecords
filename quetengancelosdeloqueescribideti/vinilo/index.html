<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinilo - Love is in the Air, Pt. 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fluid shifting animated red gradient background */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(-45deg, #7a0000, #b90000, #e01111, #8b0000, #500000);
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            color: #1a1a1a;
            overflow: hidden;
        }

        /* Subtle ambient float animation for the player stage */
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .stage-float {
            animation: subtleFloat 6s ease-in-out infinite;
        }

        /* Continuous vinyl spin animation */
        @keyframes spin-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .vinyl-spin {
            animation: spin-vinyl 2.8s linear infinite;
        }
        .vinyl-paused {
            animation-play-state: paused;
        }

        /* Authentic dark vinyl grooves texture */
        .vinyl-grooves {
            background: 
                radial-gradient(circle, 
                    #b90000 0%, #b90000 19.5%, 
                    #0f0f0f 20%, #171717 20.5%, 
                    #0b0b0b 25%, #1c1c1c 30%, 
                    #0d0d0d 35%, #181818 42%, 
                    #080808 50%, #1b1b1b 60%, 
                    #0d0d0d 70%, #151515 85%, 
                    #080808 100%
                );
            box-shadow: 
                0 30px 60px -10px rgba(0, 0, 0, 0.6),
                0 15px 25px -5px rgba(0, 0, 0, 0.4),
                inset 0 0 15px rgba(255, 255, 255, 0.15);
        }

        /* Vinyl shine reflection layer */
        .vinyl-shine {
            background: conic-gradient(
                from 45deg at 50% 50%,
                rgba(255, 255, 255, 0.18) 0deg,
                rgba(255, 255, 255, 0.0) 45deg,
                rgba(255, 255, 255, 0.14) 180deg,
                rgba(255, 255, 255, 0.0) 225deg,
                rgba(255, 255, 255, 0.18) 360deg
            );
        }

        /* Tonearm rotation and smooth transition */
        .tonearm-wrapper {
            transform-origin: 65px 65px;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .tonearm-playing {
            transform: rotate(0deg);
        }
        .tonearm-stopped {
            transform: rotate(-28deg);
        }

        /* Album Cover & Vinyl layout smooth transitions */
        .album-cover-container {
            transition: transform 0.8s cubic-bezier(0.34, 1.25, 0.64, 1), left 0.8s cubic-bezier(0.34, 1.25, 0.64, 1), box-shadow 0.8s ease;
        }

        .vinyl-container-transition {
            transition: transform 0.9s cubic-bezier(0.34, 1.25, 0.64, 1), left 0.9s cubic-bezier(0.34, 1.25, 0.64, 1), right 0.9s cubic-bezier(0.34, 1.25, 0.64, 1), opacity 0.6s ease;
        }

        /* Smooth depth z-index swap transitions */
        .depth-front {
            z-index: 30 !important;
            transform: scale(1) !important;
            box-shadow: -15px 30px 50px rgba(0, 0, 0, 0.45), 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .depth-back {
            z-index: 10 !important;
            transform: scale(0.98) !important;
            box-shadow: -5px 15px 25px rgba(0, 0, 0, 0.25);
        }

        /* Sleeve inside vinyl position */
        .cover-centered {
            left: 50% !important;
            transform: translateX(-50%) scale(1.02) !important;
        }

        .vinyl-inside-cover {
            left: 20% !important;
            transform: translateX(-50%) scale(0.92) !important;
            opacity: 0.15;
            z-index: 5 !important;
        }

        .vinyl-outside-cover {
            left: auto !important;
            opacity: 1;
        }

        /* Font styles */
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0">

    <!-- Ambient Vignette & Glow Overlay -->
    <div class="fixed inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,_transparent_40%,_rgba(0,0,0,0.45)_100%)] z-50"></div>

    <!-- Main Stage Container -->
    <div class="stage-float relative w-full h-full max-w-[1180px] max-h-[820px] flex items-center justify-center overflow-hidden">

        <!-- ALBUM COVER -->
        <div id="album-cover" 
             class="album-cover-container cover-centered depth-front absolute top-[12%] md:top-[14%] w-[42vw] max-w-[480px] aspect-square rounded-sm cursor-pointer select-none"
             onclick="handleCoverClick()">
            
            <div class="w-full h-full relative overflow-hidden rounded-sm shadow-2xl bg-[#dfd6b8] transition-shadow duration-500 hover:shadow-red-950/40">
                <!-- Custom Album Cover Image -->
                <img src="https://i.ibb.co/gFzCkSv7/Que-Tengan-Celos-De-Lo-Que-Escribi-de-ti-cover-5000-X-5000-1.png" 
                     alt="Album Cover" 
                     class="w-full h-full object-cover block filter brightness-[1.02] contrast-[1.03]"
                     onerror="this.src='https://placehold.co/800x800/d8cbb5/333?text=Cover+Image'">
                
                <!-- Inner border reflection -->
                <div class="absolute inset-0 border border-white/20 pointer-events-none"></div>
                <div class="absolute inset-0 border border-black/10 pointer-events-none"></div>
            </div>
        </div>

        <!-- VINYL DISC CONTAINER -->
        <div id="vinyl-container" 
             class="vinyl-container-transition vinyl-inside-cover absolute right-[12%] md:right-[15%] top-[10%] md:top-[12%] w-[52vw] max-w-[580px] aspect-square rounded-full z-20 flex items-center justify-center cursor-pointer select-none"
             onclick="handleVinylClick(event)"
             ondblclick="handleVinylDoubleClick(event)">
            
            <!-- Vinyl Record Body -->
            <div id="vinyl-disc" class="w-full h-full rounded-full vinyl-grooves vinyl-spin vinyl-paused relative flex items-center justify-center">
                
                <!-- Sheen overlay -->
                <div class="absolute inset-0 rounded-full vinyl-shine pointer-events-none"></div>

                <!-- Central Red Vinyl Label -->
                <div class="w-[38%] h-[38%] rounded-full bg-gradient-to-tr from-[#900000] via-[#d60000] to-[#b00000] relative flex flex-col items-center justify-center border border-red-300/40 shadow-2xl overflow-hidden text-center">
                    
                    <!-- Micro barcode graphic -->
                    <div class="absolute top-2.5 w-16 h-3 opacity-90 flex justify-center items-center bg-white/95 px-0.5 py-[1px] rounded-[1px] shadow-sm">
                        <div class="w-full h-full flex justify-between items-center overflow-hidden">
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[2px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[3px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[2px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[3px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[2px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[1px] h-full bg-black"></div>
                            <div class="w-[2px] h-full bg-black"></div>
                        </div>
                    </div>

                    <!-- Label Typography -->
                    <div class="flex flex-col items-center justify-center transform rotate-180 mt-2 px-2">
                        <span class="font-cinzel text-[9px] sm:text-[11px] md:text-[12px] font-bold text-white tracking-wider leading-tight mb-0.5 drop-shadow-md">Love is in the Air, Pt. 1</span>
                        <span class="text-[7px] sm:text-[8px] md:text-[9px] text-red-100/90 tracking-widest font-medium uppercase">Sade</span>
                    </div>

                    <!-- Center Spindle Hole -->
                    <div class="w-3.5 h-3.5 md:w-4 md:h-4 rounded-full bg-[#650000] border border-stone-900 shadow-inner z-10 absolute"></div>
                </div>
            </div>
        </div>

        <!-- TONEARM MECHANISM -->
        <div id="tonearm-base" 
             class="absolute right-[4%] md:right-[6%] top-[6%] md:top-[8%] w-[160px] h-[340px] md:w-[180px] md:h-[400px] z-40 pointer-events-auto cursor-pointer"
             onclick="togglePlayState()">
            
            <!-- White rounded base outline -->
            <div class="absolute right-2 top-2 w-28 h-44 rounded-full border border-white/20 bg-transparent pointer-events-none">
                <div class="absolute top-2 right-2 w-20 h-20 rounded-full border border-white/15"></div>
            </div>

            <!-- Tonearm Assembly -->
            <div id="tonearm" class="w-full h-full relative tonearm-wrapper tonearm-stopped">
                
                <!-- Pivot Base Mount -->
                <div class="absolute top-8 right-10 w-14 h-14 rounded-full bg-[#e2ded5] shadow-lg border border-stone-300 flex items-center justify-center">
                    <div class="w-10 h-10 rounded-full bg-[#d6d0c4] border border-stone-400/50 shadow-inner flex items-center justify-center">
                        <div class="w-4 h-4 rounded-full bg-stone-300 border border-stone-400"></div>
                    </div>
                </div>

                <!-- Metallic Arm Shaft -->
                <div class="absolute top-14 right-[62px] w-[6px] h-[240px] md:h-[280px] bg-gradient-to-r from-stone-200 via-stone-100 to-stone-400 rounded-full shadow-lg"></div>

                <!-- White Cartridge / Headshell -->
                <div class="absolute bottom-6 md:bottom-10 right-[38px] w-9 h-14 bg-[#f7f5f0] border border-stone-300 shadow-xl rounded-sm transform -rotate-12 flex flex-col items-center justify-between p-1">
                    <div class="w-1.5 h-4 bg-stone-300 rounded-full absolute -right-2 top-3"></div>
                    <div class="w-full h-2 bg-stone-200 border-b border-stone-300"></div>
                    <div class="w-2 h-2 rounded-full bg-stone-800 mb-1"></div>
                </div>

            </div>
        </div>

    </div>

    <!-- Interactive & Web Audio Logic -->
    <script>
        let isPlaying = false;
        let isCoverFront = true;
        let isVinylEjected = false;
        let clickTimer = null;

        let audioCtx = null;
        let vinylCrackleNode = null;
        let musicGain = null;
        let oscillators = [];

        // Auto-intro animation: Eject vinyl automatically after 2 seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                ejectVinyl();
            }, 2000);
        });

        function ejectVinyl() {
            const cover = document.getElementById('album-cover');
            const vinyl = document.getElementById('vinyl-container');
            
            cover.classList.remove('cover-centered');
            cover.style.left = '8%';

            vinyl.classList.remove('vinyl-inside-cover');
            vinyl.classList.add('vinyl-outside-cover');
            isVinylEjected = true;
        }

        function insertVinyl() {
            if (isPlaying) {
                togglePlayState(); // Stop music if playing when stored
            }

            const cover = document.getElementById('album-cover');
            const vinyl = document.getElementById('vinyl-container');

            vinyl.classList.remove('vinyl-outside-cover');
            vinyl.classList.add('vinyl-inside-cover');

            cover.classList.add('cover-centered');
            cover.style.left = '';
            isVinylEjected = false;
        }

        function handleCoverClick() {
            if (!isVinylEjected) {
                ejectVinyl();
            } else {
                toggleCoverDepth();
            }
        }

        function handleVinylClick(event) {
            if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (!isVinylEjected) {
                        ejectVinyl();
                    } else {
                        togglePlayState();
                    }
                }, 250);
            }
        }

        function handleVinylDoubleClick(event) {
            if (clickTimer !== null) {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
            if (isVinylEjected) {
                insertVinyl();
            } else {
                ejectVinyl();
            }
        }

        // Depth positioning (Front <-> Behind Vinyl)
        function toggleCoverDepth() {
            const cover = document.getElementById('album-cover');
            if (isCoverFront) {
                cover.classList.remove('depth-front');
                cover.classList.add('depth-back');
                isCoverFront = false;
            } else {
                cover.classList.remove('depth-back');
                cover.classList.add('depth-front');
                isCoverFront = true;
            }
        }

        // Toggle Playback and Tonearm Position
        function togglePlayState() {
            if (!isVinylEjected) {
                ejectVinyl();
                return;
            }

            isPlaying = !isPlaying;
            const vinylDisc = document.getElementById('vinyl-disc');
            const tonearm = document.getElementById('tonearm');

            if (isPlaying) {
                vinylDisc.classList.remove('vinyl-paused');
                tonearm.classList.remove('tonearm-stopped');
                tonearm.classList.add('tonearm-playing');
                startSoundtrack();
            } else {
                vinylDisc.classList.add('vinyl-paused');
                tonearm.classList.remove('tonearm-playing');
                tonearm.classList.add('tonearm-stopped');
                stopSoundtrack();
            }
        }

        // Web Audio Synthesizer
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function startSoundtrack() {
            initAudioContext();
            stopSoundtrack();

            musicGain = audioCtx.createGain();
            musicGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            musicGain.connect(audioCtx.destination);

            const chords = [138.59, 174.61, 207.65, 261.63, 311.13];
            chords.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(musicGain);
                osc.start();
                oscillators.push(osc);
            });

            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                if (Math.random() < 0.0012) {
                    output[i] = (Math.random() * 2 - 1) * 0.7;
                } else {
                    output[i] = (Math.random() * 2 - 1) * 0.015;
                }
            }

            vinylCrackleNode = audioCtx.createBufferSource();
            vinylCrackleNode.buffer = noiseBuffer;
            vinylCrackleNode.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1400;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.06, audioCtx.currentTime);

            vinylCrackleNode.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            vinylCrackleNode.start();
        }

        function stopSoundtrack() {
            if (oscillators.length > 0) {
                oscillators.forEach(osc => {
                    try { osc.stop(); } catch(e){}
                });
                oscillators = [];
            }
            if (vinylCrackleNode) {
                try { vinylCrackleNode.stop(); } catch(e){}
                vinylCrackleNode = null;
            }
            if (musicGain) {
                musicGain.disconnect();
                musicGain = null;
            }
        }
    </script>
</body>
</html>
