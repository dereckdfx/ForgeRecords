main.agrid{margin-top:calc(var(--hb,62px) + 62px)}

.agrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 6px}
.acard{position:relative;display:block;aspect-ratio:1;background:#111 center/cover no-repeat;text-decoration:none;overflow:hidden}
.acard::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.acard b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:800 clamp(14px,4.4vw,22px)/1.2 Unbounded;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.amail{grid-column:1/-1;padding:26px 10px 20px;font-family:Unbounded}
.amail h3{font-size:14px;font-weight:700;line-height:1.35;margin:0 0 18px}
.amail .frow{display:flex;gap:12px}.amail input[type=email]{flex:1;min-width:0;background:#000;border:1.5px solid #fff;border-radius:3px;color:#fff;padding:12px;font:700 14px Unbounded}
.amail button{background:linear-gradient(#f4f4f4,#a9adb2);border:0;border-radius:3px;font:800 14px Unbounded;padding:0 20px;color:#000}
.amail .ok{font-size:13px;color:#ccc}
@media(min-width:700px){.agrid{grid-template-columns:repeat(4,1fr);max-width:1200px;margin-left:auto;margin-right:auto;gap:18px}.acard b{font-size:clamp(16px,1.6vw,22px)}}

<script>
document.querySelectorAll('.badge-slot').forEach((e,i)=>e.innerHTML=badgeSVG('b'+i));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=a=>`artist.html?a=${a.s}&frontpage=true`,list=[...ARTISTS].sort((x,y)=>x.n.localeCompare(y.n,'es'));
const g=document.getElementById('agrid');
let html='';list.forEach((a,i)=>{html+=`<a class="acard" href="${url(a)}" style="background-image:url('${a.img}')${a.pos?';background-position:'+a.pos:''}${a.fit?';background-size:contain;background-color:#000':''}"><b>${esc(a.n)}</b></a>`;
if(i===Math.min(7,list.length-1))html+=`<section class="amail"><h3>Únete a nuestra lista para enterarte de lo último de todos nuestros artistas</h3><form class="aform" novalidate><div class="frow"><input type="email" placeholder="Email" aria-label="Email" required><button type="submit">Submit</button></div></form></section>`});
g.innerHTML=html;
// custom "Selecciona un artista" dropdown (Atlantic style): bold names separated by thin white lines; click goes to the artist page
{const w=document.getElementById('aselw'),b=document.getElementById('asbtn'),ul=document.getElementById('aslist');
ul.innerHTML=list.map(a=>`<li role="option"><a href="${url(a)}">${esc(a.n)}</a></li>`).join('');
const set=o=>{w.classList.toggle('open',o);b.setAttribute('aria-expanded',o)};b.onclick=e=>{e.stopPropagation();set(!w.classList.contains('open'))};
document.addEventListener('click',e=>{if(!w.contains(e.target))set(false)});addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
addEventListener('pageshow',e=>{if(e.persisted)set(false)});if(/[?&]open\b/.test(location.search))set(true)}
{const hb=()=>document.documentElement.style.setProperty('--hb',document.querySelector('header').offsetHeight+'px');hb();addEventListener('resize',hb)}
document.querySelectorAll('form.aform,#foot .fform').forEach(fm=>fm.onsubmit=e=>{e.preventDefault();const i=fm.querySelector('input[type=email]');if(!i.value||!i.checkValidity()){i.focus();i.style.borderColor='#ff6b6b';return}forgeMail(i.value);fm.innerHTML='<p class="ok fthanks">¡Casi listo! Envía el correo que se abrió para suscribirte.</p>'});
</script></body></html>
